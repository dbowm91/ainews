<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <title>{% block title %}ainews// admin{% endblock %}</title>
  <style>
/* ainews - Critical CSS (inlined for performance) */
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-subtle: #1c2128;
  --border: #30363d;
  --border-light: #3d444d;
  --text-primary: #e6edf3;
  --text-secondary: #c9d1d9;
  --text-muted: #8b949e;
  --text-dim: #9ea7b0;
  --accent: #58a6ff;
  --accent-dim: #1f6feb;
  --green: #3fb950;
  --orange: #d29922;
  --red: #f85149;
  --purple: #bc8cff;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
  --max-width: 820px;
  --radius-sm: 3px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --space-1: 0.15rem;
  --space-2: 0.25rem;
  --space-3: 0.35rem;
  --space-4: 0.5rem;
  --space-5: 0.6rem;
  --space-6: 0.75rem;
  --space-7: 1rem;
  --accent-alpha-08: rgba(88, 166, 255, 0.08);
  --accent-alpha-10: rgba(88, 166, 255, 0.1);
  --accent-alpha-25: rgba(88, 166, 255, 0.25);
  --orange-alpha-10: rgba(210, 153, 34, 0.1);
  --orange-alpha-25: rgba(210, 153, 34, 0.25);
  --z-index-sticky: 100;
  --z-index-share-dropdown: 200;
  --z-index-skip-link: 1000;
  --z-index-toast: 9999;
}
[data-theme="light"] {
  --bg-primary: #ffffff;
  --bg-secondary: #f6f8fa;
  --bg-tertiary: #eaeef2;
  --border: #d0d7de;
  --border-light: #afb8c1;
  --text-primary: #1f2328;
  --text-secondary: #57606a;
  --text-muted: #6e7781;
  --text-dim: #6e7781;
  --accent: #0969da;
  --accent-dim: #0550ae;
  --green: #1a7f37;
  --orange: #9a6700;
  --red: #cf222e;
  --purple: #8250df;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 15px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { font-family: var(--font-sans); background: var(--bg-primary); color: var(--text-secondary); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
.skip-link { position: absolute; top: -40px; left: 0; background: var(--accent); color: #fff; padding: 0.5rem 1rem; font-family: var(--font-mono); font-size: 0.85rem; z-index: var(--z-index-skip-link); transition: top 0.15s; text-decoration: none; }
.skip-link:focus { top: 0; outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
a { color: var(--accent); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--text-primary); text-decoration: underline; }
.admin-header { border-bottom: 1px solid var(--border); background: var(--bg-secondary); position: sticky; top: 0; z-index: var(--z-index-sticky); }
.nav { max-width: var(--max-width); margin: 0 auto; padding: 0.75rem 1.25rem; display: flex; align-items: center; gap: 1.5rem; }
.logo { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
.logo:hover { text-decoration: none; color: var(--accent); }
.logo-slash { color: var(--accent); }
.nav-links { display: flex; gap: 0.75rem; flex: 1; }
.nav-links a { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); padding: var(--space-1) var(--space-4); border-radius: var(--radius-md); transition: color 0.15s, background-color 0.15s, border-color 0.15s; }
.nav-links a:hover, .nav-links a.active { color: var(--text-primary); background: var(--bg-tertiary); text-decoration: none; }
.nav-meta { flex-shrink: 0; }
.nav-tag { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); border: 1px solid var(--border); padding: 0.15rem 0.5rem; border-radius: 3px; }
.container { max-width: var(--max-width); margin: 0 auto; padding: 1.5rem 1.25rem; flex: 1; width: 100%; }
#content { transition: opacity 0.2s ease; }
.htmx-request #content { opacity: 0.7; }
.htmx-request::before { content: ''; display: block; position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-dim), var(--accent)); background-size: 200% 100%; animation: progress-bar 1s ease-in-out infinite; z-index: var(--z-index-toast); }
@keyframes progress-bar { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
.htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
.theme-toggle { background: none; border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-2); cursor: pointer; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; transition: color 0.15s, border-color 0.15s; }
.theme-toggle:hover { color: var(--accent); border-color: var(--accent-dim); }
.theme-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.theme-toggle svg { width: 16px; height: 16px; }
.theme-icon-light, [data-theme="light"] .theme-icon-dark { display: none; }
[data-theme="light"] .theme-icon-light { display: block; }
.nav-toggle-label { display: none; }
.noscript-warning { background: var(--orange); color: var(--bg-primary); padding: 0.75rem 1rem; font-family: var(--font-mono); font-size: 0.8rem; text-align: center; }
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); padding: 0.75rem 1.25rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-primary); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); z-index: var(--z-index-toast); opacity: 1; transition: opacity 0.2s; animation: toast-slide-up 0.3s ease-out; white-space: nowrap; }
@keyframes toast-slide-up { from { transform: translateX(-50%) translateY(1rem); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
.toast-hidden { opacity: 0; pointer-events: none; }
@media (max-width: 640px) {
  .nav-toggle-label { display: block; width: 44px; height: 44px; position: relative; cursor: pointer; }
  .nav-toggle-label span, .nav-toggle-label span::before, .nav-toggle-label span::after { display: block; position: absolute; width: 24px; height: 2px; background: var(--text-primary); left: 50%; transform: translateX(-50%); transition: transform 0.3s, opacity 0.3s; }
  .nav-toggle-label span::before, .nav-toggle-label span::after { content: ''; }
  .nav-toggle-label span::before { top: -8px; }
  .nav-toggle-label span::after { top: 8px; }
  .nav-toggle-checkbox:checked + .nav-toggle-label span { background: transparent; }
  .nav-toggle-checkbox:checked + .nav-toggle-label span::before { transform: translateX(-50%) rotate(45deg); }
  .nav-toggle-checkbox:checked + .nav-toggle-label span::after { transform: translateX(-50%) rotate(-45deg); }
  .nav-links { display: none; order: 3; width: 100%; }
  .nav-toggle-checkbox:checked ~ .nav-links { display: flex; flex-direction: column; width: 100%; }
  .nav { flex-wrap: wrap; gap: 0.5rem; }
  .nav-meta { display: none; }
  .nav-links a { min-height: 44px; display: inline-flex; align-items: center; }
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
html { scrollbar-width: thin; scrollbar-color: var(--border) var(--bg-primary); }
::selection { background: var(--accent-alpha-25); color: var(--text-primary); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/share-a11y.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body class="admin-body" hx-boost="true">
  <noscript><p class="noscript-warning">JavaScript is disabled. Some features may not work.</p></noscript>
  <div id="offline-toast" class="toast toast-hidden" role="status" aria-live="polite">You are offline.</div>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <a href="#content" class="skip-link">Skip to content</a>
  <header class="admin-header">
    <nav class="nav">
      <a href="/admin/" class="logo">ainews<span class="logo-slash">//</span> admin</a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox" hidden>
      <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation">
        <span></span>
      </label>
      <div class="nav-links">
        <a href="/" hx-boost="false" {% if request.path == '/' %}class="active"{% endif %}>public site</a>
        <a href="/admin/" {% if request.path == '/admin/' %}class="active"{% endif %}>dashboard</a>
        <a href="/admin/pipelines" {% if request.path.startswith('/admin/pipelines') %}class="active"{% endif %}>pipelines</a>
        <a href="/admin/review" {% if request.path == '/admin/review' %}class="active"{% endif %}>review</a>
        <a href="/admin/articles" {% if request.path.startswith('/admin/articles') %}class="active"{% endif %}>articles</a>
        <a href="/admin/newsletters" {% if request.path.startswith('/admin/newsletters') %}class="active"{% endif %}>newsletters</a>
        <a href="/admin/metrics" {% if request.path == '/admin/metrics' %}class="active"{% endif %}>metrics</a>
        <a href="/admin/subscribers" {% if request.path.startswith('/admin/subscribers') %}class="active"{% endif %}>subscribers</a>
        <a href="/admin/shares" {% if request.path.startswith('/admin/shares') %}class="active"{% endif %}>shares</a>
        {% include "partials/theme_toggle.html" %}
      </div>
      <div class="nav-meta">
        <form method="POST" action="/admin/logout" class="inline" hx-boost="false">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn-logout">logout</button>
        </form>
      </div>
    </nav>
  </header>

  <main class="container">
    {% block breadcrumbs %}{% endblock %}
    <div id="content">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
