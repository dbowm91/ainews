name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Required checks for protected `main`
# ---------------------------------------------------------------------------
# Branch protection must require ALL of these jobs to pass before merge:
#
#   lint-and-test        — ruff lint + mypy type-check + pytest with coverage
#   pip-audit            — dependency vulnerability scan
#   trivy                — filesystem vulnerability scan
#   docker-build         — image build + testing/prod smoke
#   smoke-tests          — production config, Celery, migration, docs consistency
#   theme-validation     — theme CLI validation + lifecycle/preference/recovery tests
#   theme-browser-smoke  — Playwright: theme switching + frontend rendering regressions
#   compose-smoke        — full Docker Compose boot + health check
#   gitleaks             — secret scanning
# ---------------------------------------------------------------------------

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-ci-secret-key-00000000000000000000000000000000
      CELERY_TASK_SECRET: test-ci-celery-secret-0000000000000000000000
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run ruff
        run: .venv/bin/ruff check . --exclude .venv

      - name: Ensure instance directory exists
        run: mkdir -p instance

      - name: Run tests with coverage
        run: .venv/bin/python -m pytest tests/ -x -q --cov --cov-report=html --cov-report=xml

      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Upload pytest XML on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: coverage.xml
          retention-days: 7

      - name: Run mypy
        run: .venv/bin/mypy . --exclude .venv

  pip-audit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Install pip-audit
        run: uv pip install pip-audit

      - name: Run pip-audit
        run: .venv/bin/pip-audit

  trivy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"

  docker-build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Generate throwaway .env for compose
        run: |
          SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          CELERY_TASK_SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          cat > .env <<EOF
          FLASK_CONFIG=production
          SECRET_KEY=${SECRET_KEY}
          ADMIN_PASSWORD=""
          CELERY_TASK_SECRET=${CELERY_TASK_SECRET}
          DATABASE_URL=sqlite:///app/instance/prod.db
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/1
          EOF
          chmod 600 .env

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Validate Ollama Compose override
        run: docker compose -f docker-compose.yml -f docker-compose.ollama.yml config --quiet

      - name: Build Docker image
        run: docker build -t ainews-ci .

      - name: Smoke test image starts
        run: |
          docker run --rm --name ainews-smoke \
            -e FLASK_CONFIG=testing \
            -e SECRET_KEY=test-smoke-key-for-ci-only-000000000000000000000000000000 \
            -e ADMIN_PASSWORD="" \
            -e CELERY_TASK_SECRET=test-smoke-secret-for-ci-only-0000000000000000000 \
            -e CELERY_BROKER_URL=redis://localhost:6379/0 \
            -e CELERY_RESULT_BACKEND=redis://localhost:6379/1 \
            ainews-ci \
            python -c "from app import create_app; print('App factory OK')"

      - name: Production mode image smoke
        run: |
          SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          HASHED_PW=$(.venv/bin/python -c "from werkzeug.security import generate_password_hash; print(generate_password_hash('ci-test-password-123'))")
          CELERY_SECRET=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          docker run --rm \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            -e FLASK_CONFIG=production \
            -e SECRET_KEY="$SECRET_KEY" \
            -e ADMIN_PASSWORD="$HASHED_PW" \
            -e CELERY_TASK_SECRET="$CELERY_SECRET" \
            -e DATABASE_URL=sqlite:////tmp/prod-smoke.db \
            -e CELERY_BROKER_URL=redis://localhost:6379/0 \
            -e CELERY_RESULT_BACKEND=redis://localhost:6379/1 \
            -e LLM_PROVIDERS_FILE=/fixtures/providers.ci.yaml \
            ainews-ci \
            python -c "from app import create_app; create_app('production'); print('Production app factory OK')"

  smoke-tests:
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-ci-secret-key-00000000000000000000000000000000
      CELERY_TASK_SECRET: test-ci-celery-secret-0000000000000000000000
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run production config smoke tests
        run: .venv/bin/python -m pytest tests/test_smoke_production_config.py -v

      - name: Run Celery smoke tests
        run: .venv/bin/python -m pytest tests/test_smoke_celery.py -v

      - name: Run migration smoke tests
        run: .venv/bin/python -m pytest tests/test_smoke_migrations.py -v

      - name: Run docs consistency smoke tests
        run: .venv/bin/python -m pytest tests/test_docs_env_consistency.py -v

  theme-validation:
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-ci-secret-key-00000000000000000000000000000000
      CELERY_TASK_SECRET: test-ci-celery-secret-0000000000000000000000
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run theme validation CLI
        run: .venv/bin/python scripts/validate_themes.py --bundled --strict

      - name: Run theme lifecycle tests
        run: .venv/bin/python -m pytest tests/test_theme_lifecycle.py -v

      - name: Run theme preference validation tests
        run: .venv/bin/python -m pytest tests/test_theme_preference_validation.py -v

      - name: Run theme failure recovery tests
        run: .venv/bin/python -m pytest tests/test_theme_failure_recovery.py -v

      - name: Run theme accessibility validation tests
        run: .venv/bin/python -m pytest tests/test_theme_accessibility_validation.py -v

      - name: Run theme visual validation tests
        run: .venv/bin/python -m pytest tests/test_theme_visual_validation.py -v

      - name: Run theme package validation tests
        run: .venv/bin/python -m pytest tests/test_theme_package_validation.py -v

  theme-browser-smoke:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Install Playwright browsers
        run: .venv/bin/playwright install --with-deps chromium

      - name: Run theme browser smoke tests
        run: .venv/bin/python -m pytest tests/test_theme_browser_smoke.py -v --timeout=180

      - name: Run frontend rendering browser tests
        run: .venv/bin/python -m pytest tests/test_frontend_rendering_browser.py -v --timeout=180

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theme-browser-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  compose-smoke:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Docker Compose boot smoke
        run: bash scripts/ci_compose_smoke.sh

  gitleaks:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
