{% extends "base.html" %}

{% block title %}ainews// {{ article.original_title|e }}{% endblock %}

{% block meta %}
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ article.original_title|e }}">
  <meta property="og:description" content="{{ (article.summary or article._summary.tldr if article._summary else '')|e }}">
  <meta name="description" content="{{ (article.summary or article._summary.tldr if article._summary else '')|e }}">
  <meta property="twitter:card" content="summary">
  <meta property="twitter:title" content="{{ article.original_title|e }}">
  <meta property="twitter:description" content="{{ (article.summary or article._summary.tldr if article._summary else '')|e }}">
{% endblock %}

{% block content %}
{% include "partials/article_detail.html" %}
{% endblock %}
