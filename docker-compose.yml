services:
  db-migrate:
    build: .
    command: flask db upgrade
    env_file: .env
    environment:
      - FLASK_CONFIG=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/instance/prod.db}
    volumes:
      - app-data:/app/instance
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 1G
    env_file: .env
    environment:
      - FLASK_CONFIG=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/instance/prod.db}
      - AINEWS_RUNNING_IN_DOCKER=1
    volumes:
      - app-data:/app/instance
      - ./static:/app/static:ro
    tmpfs:
      - /tmp
    read_only: true
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A celery_app:celery_app worker -l info --concurrency=4
    deploy:
      resources:
        limits:
          memory: 512M
    env_file: .env
    environment:
      - FLASK_CONFIG=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/instance/prod.db}
      - CELERY_CONCURRENCY=4
      - AINEWS_RUNNING_IN_DOCKER=1
    volumes:
      - app-data:/app/instance
    tmpfs:
      - /tmp
    read_only: true
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h redis ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery-beat:
    build: .
    command: celery -A celery_app:celery_app beat -l info --schedule=/app/instance/celerybeat-schedule
    deploy:
      resources:
        limits:
          memory: 256M
    env_file: .env
    environment:
      - FLASK_CONFIG=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/instance/prod.db}
      - AINEWS_RUNNING_IN_DOCKER=1
    volumes:
      - app-data:/app/instance
    tmpfs:
      - /tmp
    read_only: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h redis ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  app-data:
  redis-data:
