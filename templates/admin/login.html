<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ainews// login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body class="admin-body">
  <noscript><p class="noscript-warning">JavaScript is required for theme toggle and full functionality.</p></noscript>
<body class="admin-body">
  <main class="login-container">
    <div class="login-box">
      <h1 class="login-title">ainews<span class="logo-slash">//</span></h1>
      <p class="login-subtitle">admin login</p>
      {% if error %}
        <p class="login-error">{{ error|e }}</p>
      {% endif %}
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="login-password" class="sr-only">Password</label>
        <input
          type="password"
          name="password"
          id="login-password"
          placeholder="password"
          class="login-input"
          autofocus
          required
        >
        <button type="submit" class="login-btn">login</button>
      </form>
      <a href="/" class="login-back-link">back to site</a>
    </div>
  </main>
</body>
</html>
