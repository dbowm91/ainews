<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ainews// login</title>
  {% if theme_metadata is defined and theme_metadata %}
  <script id="ainews-theme-metadata" type="application/json">{{ theme_metadata|tojson }}</script>
  {% endif %}
  <link id="ainews-app-stylesheet" rel="stylesheet" href="{{ url_for('static', filename='css/style.bundled.css') }}">
  <link id="ainews-theme-stylesheet" rel="stylesheet" href="">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body class="admin-body">
  <noscript><p class="noscript-warning">JavaScript is required for theme selector and full functionality.</p></noscript>
  <main class="login-container">
    <div class="login-box">
      <h1 class="login-title">ainews<span class="logo-slash">//</span></h1>
      <p class="login-subtitle">admin login</p>
      {% if error %}
        <p class="login-error">{{ error|e }}</p>
      {% endif %}
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="login-password" class="sr-only">Password</label>
        <div class="login-password-wrapper">
          <input
            type="password"
            name="password"
            id="login-password"
            placeholder="password"
            class="login-input"
            autocomplete="current-password"
            autofocus
            required
          >
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <button type="submit" class="login-btn">login</button>
      </form>
      <a href="/" class="login-back-link">back to site</a>
    </div>
  </main>
</body>
</html>
