openapi: 3.0.3
info:
  title: ainews Admin API v1
  description: Admin API for managing ainews sources, articles, webhooks, and pipeline.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Admin API v1
paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: Service health status
  /sources:
    get:
      summary: List sources
      tags: [Sources]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated source list
    post:
      summary: Create source
      tags: [Sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Source created
  /sources/{id}:
    get:
      summary: Get source
      tags: [Sources]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Source details
    put:
      summary: Replace source
      tags: [Sources]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '200':
          description: Source replaced
    patch:
      summary: Update source
      tags: [Sources]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: Source updated
    delete:
      summary: Delete source
      tags: [Sources]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Source deleted
  /articles:
    get:
      summary: List articles
      tags: [Articles]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 50
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
      responses:
        '200':
          description: Paginated article list
  /articles/ids:
    get:
      summary: Get articles by IDs
      tags: [Articles]
      parameters:
        - in: query
          name: ids
          schema:
            type: string
          description: Comma-separated article IDs
      responses:
        '200':
          description: Articles list
  /articles/counts-by-status:
    get:
      summary: Get article counts by status
      tags: [Articles]
      responses:
        '200':
          description: Status counts
  /articles/bulk:
    post:
      summary: Bulk article operations
      tags: [Articles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [set_status, set_category, delete, reprocess, add_tags]
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Bulk operation result
  /webhooks:
    get:
      summary: List webhooks
      tags: [Webhooks]
      responses:
        '200':
          description: Webhook list
    post:
      summary: Create webhook
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook created
  /webhooks/{id}:
    get:
      summary: Get webhook
      tags: [Webhooks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Webhook details
    put:
      summary: Update webhook
      tags: [Webhooks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Webhook updated
    patch:
      summary: Patch webhook
      tags: [Webhooks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Webhook patched
    delete:
      summary: Delete webhook
      tags: [Webhooks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Webhook deleted
  /webhooks/{id}/test:
    post:
      summary: Test webhook
      tags: [Webhooks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Test result
  /webhooks/{id}/events:
    get:
      summary: List webhook events
      tags: [Webhooks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Webhook events
  /webhooks/events/{event_id}/resend:
    post:
      summary: Resend webhook event
      tags: [Webhooks]
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Resend result
  /pipeline/stats:
    get:
      summary: Pipeline stage statistics
      tags: [Pipeline]
      responses:
        '200':
          description: Pipeline stats
  /pipeline/dead-letter/stats:
    get:
      summary: Dead letter queue stats
      tags: [Pipeline]
      responses:
        '200':
          description: Dead letter statistics
  /pipeline/backlog:
    get:
      summary: Pipeline backlog
      tags: [Pipeline]
      responses:
        '200':
          description: Backlog stats

  /pipeline/sla:
    get:
      summary: Pipeline SLA compliance
      tags: [Pipeline]
      responses:
        '200':
          description: SLA stats

  /costs:
    get:
      summary: LLM cost breakdown
      tags: [Costs]
      responses:
        '200':
          description: Cost breakdown by provider/model

  /sources/health:
    get:
      summary: Source health status
      tags: [Sources]
      responses:
        '200':
          description: Source health summary

  /newsletters/stats:
    get:
      summary: Newsletter statistics
      tags: [Newsletters]
      responses:
        '200':
          description: Newsletter delivery stats

  /newsletter/preview:
    post:
      summary: Preview newsletter
      tags: [Newsletters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic:
                  type: string
      responses:
        '200':
          description: Newsletter preview

  /audit-logs:
    get:
      summary: List audit logs
      tags: [Audit]
      parameters:
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: target_type
          schema:
            type: string
        - in: query
          name: days
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Paginated audit log list

  /config/reload:
    post:
      summary: Reload configuration
      tags: [Config]
      responses:
        '200':
          description: Config reloaded

  /tasks/{task_id}:
    get:
      summary: Get task status
      tags: [Tasks]
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task status

  /alerts:
    get:
      summary: Get active alerts
      tags: [Alerts]
      responses:
        '200':
          description: Active alerts grouped by severity

  /articles/{article_id}/quality:
    get:
      summary: Get article quality report
      tags: [Quality]
      parameters:
        - in: path
          name: article_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Quality report for article

  /quality/recent:
    get:
      summary: Get recent quality reports
      tags: [Quality]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Recent quality reports

  /articles/{article_id}/pipeline/history:
    get:
      summary: Get article pipeline history
      tags: [Pipeline]
      parameters:
        - in: path
          name: article_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pipeline run history for article

  /articles/{article_id}/pipeline/replay:
    post:
      summary: Replay article pipeline
      tags: [Pipeline]
      parameters:
        - in: path
          name: article_id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from_stage:
                  type: string
      responses:
        '202':
          description: Pipeline replay started

  /articles/{article_id}/pipeline/restore-version:
    post:
      summary: Restore article to version
      tags: [Pipeline]
      parameters:
        - in: path
          name: article_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version_id
              properties:
                version_id:
                  type: integer
      responses:
        '200':
          description: Article restored to version

  /sources/performance:
    get:
      summary: Get source performance metrics
      tags: [Sources]
      responses:
        '200':
          description: Source performance data

  /topics/coverage:
    get:
      summary: Get topic coverage analysis
      tags: [Sources]
      responses:
        '200':
          description: Topic coverage data

  /sources/recommendations:
    get:
      summary: Get source recommendations
      tags: [Sources]
      responses:
        '200':
          description: Source recommendations

  /topic-gap/reports:
    get:
      summary: Get topic gap analysis
      tags: [Sources]
      responses:
        '200':
          description: Topic gap analysis report
components:
  schemas:
    CreateSourceRequest:
      type: object
      required:
        - name
        - url
        - source_type
      properties:
        name:
          type: string
          maxLength: 128
        url:
          type: string
          format: uri
        source_type:
          type: string
          enum: [rss, api, scrape]
        topics:
          type: array
          items:
            type: string
    UpdateSourceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        url:
          type: string
          format: uri
        topics:
          type: array
          items:
            type: string
    CreateWebhookRequest:
      type: object
      required:
        - name
        - url
        - events
      properties:
        name:
          type: string
          maxLength: 128
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [article.published, article.failed, newsletter.sent, newsletter.failed, article.selected]
        secret:
          type: string
    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: integer
        user:
          type: string
        ip_address:
          type: string
        details:
          type: object
        created_at:
          type: string
          format: date-time