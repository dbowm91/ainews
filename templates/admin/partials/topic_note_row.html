<tr>
  <td>
    <span class="mono">{{ note.topic }}</span>
  </td>
  <td>
    <span class="mono text-muted">{{ note.source or "—" }}</span>
  </td>
  <td class="note-preview">
    <span class="text-muted">{{ note.note[:100] }}{% if note.note|length > 100 %}...{% endif %}</span>
  </td>
  <td>
    <span class="mono text-muted">{{ note.updated_at.strftime("%Y-%m-%d %H:%M") if note.updated_at else "—" }}</span>
  </td>
  <td>
    <div class="btn-group">
      <button type="button" class="btn btn-sm btn-secondary"
              hx-get="{{ url_for('admin.topic_notes_row', topic=note.topic, source=note.source or '') }}"
              hx-target="closest tr"
              hx-swap="outerHTML">
        edit
      </button>
      <form method="post" action="{{ url_for('admin.topic_notes_delete') }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="topic" value="{{ note.topic }}">
        <input type="hidden" name="source" value="{{ note.source or '' }}">
        <button type="submit" class="btn btn-sm btn-danger"
                onclick="return confirm('Delete this note?')">delete</button>
      </form>
    </div>
  </td>
</tr>
