[project]
name = "ainews"
version = "1.0.0"
description = "AI-powered news aggregation and newsletter platform"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "flask-compress==1.23",
    "flask-sqlalchemy==3.1.1",
    "flask-wtf==1.2.2",
    "flask-limiter==4.1.1",
    "flask-talisman==1.1.0",
    "flask-migrate==4.1.0",
    "celery[redis]==5.6.2",
    "redis==6.4.0",
    "requests==2.32.5",
    "beautifulsoup4==4.14.3",
    "lxml==6.0.2",
    "trafilatura==2.0.0",
    "readability-lxml==0.8.4.1",
    "python-dotenv==1.2.2",
    "markdown==3.10.2",
    "pydantic==2.12.5",
    "feedparser==6.0.12",
    "pyyaml==6.0.3",
    "ollama==0.6.1",
    "openai==2.29.0",
    "anthropic==0.86.0",
    "duckduckgo-search==8.1.1",
    "short_url==1.2.2",
    "psycopg2-binary==2.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
