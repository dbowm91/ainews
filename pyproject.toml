[project]
name = "ainews"
version = "1.0.0"
description = "AI-powered news aggregation and newsletter platform"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "asgiref==3.8.1",
    "flask-compress==1.23",
    "flask-sqlalchemy==3.1.1",
    "flask-wtf==1.2.2",
    "flask-limiter==4.1.1",
    "flask-talisman==1.1.0",
    "flask-migrate==4.1.0",
    "celery[redis]==5.6.2",
    "redis>=6.0.0,<6.5",
    "requests==2.33.0",
    "beautifulsoup4==4.14.3",
    "lxml>=6.1.0,<7",
    "trafilatura==2.0.0",
    "readability-lxml==0.8.4.1",
    "python-dotenv==1.2.2",
    "markdown==3.10.2",
    "pydantic==2.12.5",
    "feedparser==6.0.12",
    "pyyaml==6.0.3",
    "ollama==0.6.1",
    "openai==2.29.0",
    "anthropic==0.87.0",
    "google-genai>=1.0.0,<2.0.0",
    "duckduckgo-search==8.1.1",
    "httpx==0.28.1",
    "nh3==0.3.3",
    "bleach==6.2.0",
    "short_url==1.2.2",
    "defusedxml==0.7.1",
    "opentelemetry-exporter-otlp==1.35.0",
    "sentence-transformers==5.1.0",
    "pyotp==2.9.0",
    "segno==1.6.1",
    "typer>=0.12,<1",
    "ruamel.yaml>=0.18,<1",
]

[project.scripts]
ainews = "ainews_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.0,<5",
    "pytest-xdist>=3.0,<4",
    "pytest-timeout>=2.0,<3",
    "pytest-playwright>=0.8,<1",
    "ruff>=0.9.0,<1",
    "mypy>=1.0,<2",
    "types-requests>=2.31,<3",
    "types-PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--durations=10"
markers = [
    "timeout: marks tests as slow-running (deselect with '-m not timeout')",
    "browser: end-to-end Playwright tests (deselect with '-m not browser')",
    "integration: Integration tests requiring filesystem or local HTTP servers",
    "network: Tests requiring external network access",
    "docker: Tests requiring Docker",
    "slow: Slow-running tests",
]

[tool.coverage.run]
source = ["."]
omit = [".venv/**", "migrations/**", "instance/**", "tests/**"]

[tool.coverage.report]
fail_under = 80
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["BLE001", "C901", "RUF100", "B007", "B023", "B025", "B905", "S311", "F401", "E402", "C4"]

[tool.ruff.lint.per-file-ignores]
"services/alerts.py" = ["BLE001"]
"adapters/web.py" = ["S311"]
"services/quality_report.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "migrations/",
    ".venv/",
    "instance/",
    "scripts/",
]

[[tool.mypy.overrides]]
module = [
    "models.*",
    "adapters.*",
    "tasks.*",
    "routes.*",
    "services.subagent.*",
    "services.llm.*",
    "services.search.*",
    "services.metrics",
    "services.prompts",
    "services.crawling",
    "services.trend_detector",
    "services.quality_report",
    "services.source_intelligence",
    "services.topic_gap",
    "services.pipeline_monitor",
    "services.pipeline_degradation",
    "services.config_cache",
    "services.config_unified",
    "services.cache",
    "services.limiter",
    "services.logging_utils",
    "schemas.*",
    "tests.*",
    "ainews_config.*",
    "ainews_cli.*",
]
ignore_errors = true
