{% for article in articles %}
  {% include "partials/article_card.html" %}
{% endfor %}

{% if has_next %}
<div id="scroll-sentinel"
     {% if tag_slug is defined %}
       hx-get="{{ url_for('public.tag_feed', slug=tag_slug, page=next_page) }}"
     {% else %}
       hx-get="{{ url_for('public.index', page=next_page, category=category, q=query) }}"
     {% endif %}
     hx-trigger="revealed"
     hx-swap="outerHTML"
     hx-target="#scroll-sentinel"
     hx-indicator="#scroll-spinner">
  <div id="scroll-spinner" class="htmx-indicator">
    <article class="skeleton-card" aria-hidden="true">
      <div class="skeleton skeleton-badge"></div>
      <div class="skeleton skeleton-title"></div>
      <div class="skeleton skeleton-text"></div>
      <div class="skeleton skeleton-text-short"></div>
      <div class="skeleton-footer">
        <div class="skeleton skeleton-dot"></div>
        <div class="skeleton skeleton-dot"></div>
      </div>
    </article>
    <article class="skeleton-card" aria-hidden="true">
      <div class="skeleton skeleton-badge"></div>
      <div class="skeleton skeleton-title"></div>
      <div class="skeleton skeleton-text"></div>
      <div class="skeleton skeleton-text-short"></div>
      <div class="skeleton-footer">
        <div class="skeleton skeleton-dot"></div>
        <div class="skeleton skeleton-dot"></div>
      </div>
    </article>
  </div>
</div>
{% endif %}
