[project]
name = "ainews"
version = "1.0.0"
description = "AI-powered news aggregation and newsletter platform"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "asgiref==3.8.1",
    "flask-compress==1.23",
    "flask-sqlalchemy==3.1.1",
    "flask-wtf==1.2.2",
    "flask-limiter==4.1.1",
    "flask-talisman==1.1.0",
    "flask-migrate==4.1.0",
    "celery[redis]==5.6.2",
    "redis>=6.0.0,<6.5",
    "requests==2.32.5",
    "beautifulsoup4==4.14.3",
    "lxml>=6.1.0,<7",
    "trafilatura==2.0.0",
    "readability-lxml==0.8.4.1",
    "python-dotenv==1.2.2",
    "markdown==3.10.2",
    "pydantic==2.12.5",
    "feedparser==6.0.12",
    "pyyaml==6.0.3",
    "ollama==0.6.1",
    "openai==2.29.0",
    "anthropic==0.86.0",
    "google-genai>=1.0.0,<2.0.0",
    "duckduckgo-search==8.1.1",
    "httpx==0.28.1",
    "nh3==0.3.3",
    "bleach==6.2.0",
    "short_url==1.2.2",
    "defusedxml==0.7.1",
    "opentelemetry-exporter-otlp==1.35.0",
    "sentence-transformers==5.1.0",
    "pyotp==2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.0,<5",
    "pytest-xdist>=3.0,<4",
    "pytest-timeout>=2.0,<3",
    "ruff>=0.9.0,<1",
    "mypy>=1.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--durations=10"
markers = [
    "timeout: marks tests as slow-running (deselect with '-m not timeout')",
]

[tool.coverage.run]
source = ["."]
omit = [".venv/**", "migrations/**", "instance/**", "tests/**"]

[tool.coverage.report]
fail_under = 80
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["BLE001", "C901", "RUF100", "B007", "S311", "F401", "E402"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "migrations/",
    ".venv/",
    "instance/",
]
