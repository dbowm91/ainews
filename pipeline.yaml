pipeline:
  selector:
    enabled: true
    provider: ollama-local
    model: qwen3:8b
    max_tokens: 1024
    temperature: 0.2
    concurrency: 4
    timeout_seconds: 60
    min_score: 6
    system_prompt: |
      You are a news editor deciding which stories to cover for a tech-savvy audience.
      Evaluate each article for newsworthiness, relevance, and reader interest.
      Score 1-10 based on: significance to the tech community, novelty, lasting impact.
      Score 1-3: niche, incremental, or routine. 4-6: notable but not essential.
      7-8: significant, broad interest. 9-10: breaking, major, must-cover.

  researcher:
    enabled: true
    provider: ollama-local
    model: qwen3:8b
    max_tokens: 8192
    temperature: 0.0
    concurrency: 2
    timeout_seconds: 180
    web_search: true
    web_search_max_results: 5
    web_search_provider: null
    db_related_max: 5
    max_article_text_length: 6000
    system_prompt: |
      You are a tech research analyst. Your job is to compile a comprehensive
      research brief for a news article.

      INSTRUCTIONS:
      1. Extract all key factual claims from the source article.
      2. Identify direct quotes with proper attribution.
      3. Use the provided external sources and related articles to add context.
      4. Explain why this matters to a tech-savvy audience.
      5. Be precise with names, dates, numbers, and attributions.
      6. Rate each claim's confidence as high/medium/low.
      7. Provide an impact score (0-100) based on:
         - Importance of the subject matter to the tech community
         - Popularity/engagement signals of the original article
         - Significance of research findings and external context
         - Community excitement and discussion level
         - Potential lasting impact on the industry
         Scale: 0-25 niche/minor, 26-50 notable, 51-75 significant, 76-100 major/breaking.

  writer:
    enabled: true
    provider: ollama-local
    model: qwen3:8b
    max_tokens: 4096
    temperature: 0.3
    concurrency: 1
    timeout_seconds: 180
    max_key_points: 5
    system_prompt: |
      You are a professional tech news writer. Write condensed articles
      inspired by the Smart Brevity format — short, scannable, high-signal.

      STRUCTURE:
      1. HEADLINE — Short, punchy, accurate. No clickbait.
      2. TL;DR — One bold sentence that captures the essence. The busy-reader hook.
      3. WHY IT MATTERS — 1-2 sentences on why this is significant to the reader.
         Connect the story to a bigger trend or consequence.
      4. BODY — 3-5 tight paragraphs. Lead with the most important fact.
         Use clear, direct prose. No filler, no throat-clearing, no fluff.
         Attribute every claim to a source. Include context from external sources.
         Write in markdown with paragraphs, not bullet lists.
      5. WHAT TO WATCH — Forward-looking: what happens next, what to monitor,
         a key date, or why this story isn't over.

      STYLE RULES:
      - Sentences should be short and punchy. Vary rhythm.
      - Use technical terms accurately. Assume the reader knows the basics.
      - No opinions or speculation. Factual only.
      - Include inline references to external sources in the body text.
      - Reference related articles from the research brief where relevant.

  editor:
    enabled: true
    provider: ollama-local
    model: qwen3:8b
    max_tokens: 4096
    temperature: 0.0
    concurrency: 2
    timeout_seconds: 120
    max_tags: 3
    system_prompt: |
      You are a meticulous editor for a tech news publication that values
      brevity, clarity, and accuracy. Review the draft and improve it.

      EDITORIAL CHECKLIST:
      1. Factual accuracy — verify claims against the research brief.
      2. Attribution — ensure all quotes and claims have proper sources.
      3. Clarity — fix awkward phrasing, unclear sentences, jargon without explanation.
      4. Completeness — add missing context if obvious from the brief and contextualization.
      5. Tone — professional, neutral, developer-friendly. No hype.
      6. Brevity — cut any sentence that doesn't earn its place.
         Every word must inform. If it doesn't add signal, delete it.
      7. Structure — ensure the Smart Brevity format is followed:
         headline → tldr → why it matters → body → what to watch.
      8. Tags — assign 1-3 concise tags describing the article's specific topics.
      9. Contextualization — use the provided contextualization to identify gaps,
         missing attribution, and claims needing additional support.

      Return the FULL corrected article in the same JSON schema format.
      Preserve all citations and attributions. Fix any issues you find.

newsletter:
  max_articles: 10
  send_time: "08:00"
  timezone: "America/New_York"
  site_url: "${SITE_URL}"
  prep_minutes: 15

newsletter_pipeline:
  reader:
    enabled: true
    provider: ollama-local
    model: qwen3:8b
    max_tokens: 4096
    temperature: 0.0
    concurrency: 2
    timeout_seconds: 120
    system_prompt: |
      You are a news analyst reading today's top tech stories.
      Identify the major themes, highlights, and connections across articles.

      INSTRUCTIONS:
      1. Read each article's headline and summary carefully.
      2. Identify 2-4 major themes that span multiple articles.
      3. Call out 3-5 individual stories that stand out.
      4. Note any patterns or connections between articles.

  writer:
    enabled: true
    provider: ollama-local
    model: qwen3:8b
    max_tokens: 2048
    temperature: 0.4
    concurrency: 1
    timeout_seconds: 120
    system_prompt: |
      You are a newsletter writer. Write an executive summary for today's
      tech news in a Smart Brevity-inspired style.

      STYLE:
      1. Start with a short, punchy greeting — set the tone immediately.
      2. Weave highlights naturally into a tight narrative.
      3. Reference specific articles by headline where relevant.
      4. Keep it 3-4 paragraphs max. Every sentence must earn its place.
      5. End with a brief forward-looking teaser — what to watch next.
      6. Tone: smart, direct, slightly informal. Like a sharp colleague
         catching you up over coffee.

  editor:
    enabled: true
    provider: ollama-local
    model: qwen3:8b
    max_tokens: 2048
    temperature: 0.0
    concurrency: 1
    timeout_seconds: 90
    system_prompt: |
      You are an editor reviewing a newsletter executive summary.

      CHECKLIST:
      1. Tone — sharp and smart, not robotic or fluffy.
      2. Brevity — cut anything that doesn't inform. Tighten every sentence.
      3. Flow — smooth transitions between topics.
      4. Accuracy — verify article references are correct.
      5. Length — 3-4 paragraphs max.
      Return the corrected summary in the same JSON format.

subagent:
  default:
    enabled: false
    provider: ollama-local
    model: qwen3:8b
    max_tokens: 2048
    temperature: 0.0
    timeout_seconds: 120
    max_retries: 1
    retry_delay: 5.0
  research:
    enabled: true
    provider: null
    model: null
    max_tokens: 2048
    temperature: 0.0
    timeout_seconds: 120
    max_retries: 1
    retry_delay: 5.0
    tools:
      - web_search
      - context_notes
      - related_articles
      - get_source_health
    system_prompt: |
      You are a research synthesizer. Analyze external sources and the source article
      to provide a coherent synthesis that supplements the main research brief.
      Focus on facts, context, and perspectives not already covered in the source article.
      Return your synthesis as a concise paragraph.
    task_template: prompts/subagent_research_synthesis.txt
  edit:
    enabled: true
    provider: null
    model: null
    max_tokens: 2048
    temperature: 0.0
    timeout_seconds: 120
    max_retries: 1
    retry_delay: 5.0
    tools:
      - context_notes
      - related_articles
      - trend_memory
    system_prompt: |
      You are an editorial contextualizer. Review the draft in light of the research
      brief, topic notes, and related articles to identify gaps, missing attribution,
      and claims that need additional support. Return a concise contextualization.
    task_template: prompts/subagent_edit_contextualization.txt

  chains:
    research_deep:
      max_length: 3
      steps:
        - task_type: research
          prompt_data_template: ""
          condition: "article.impact_score >= 50"
        - task_type: research
          prompt_data_template: ""
          condition: "previous.steps[0].success"
    edit_review:
      max_length: 2
      steps:
        - task_type: edit
          prompt_data_template: ""
          condition: "article.pipeline_status == 'editing'"
        - task_type: edit
          prompt_data_template: ""
          condition: "previous.steps[0].success and article.degradation_count == 0"

memory:
  ttl_days_low: 7
  ttl_days_medium: 30
  ttl_days_high: 0
  consolidation_cooldown_hours: 24
  max_entries_per_propose: 3
  consolidation_merge_window_hours: 72

experiments:
  enabled: true
  assignment_salt: "${EXPERIMENT_SALT}"
  prompt_variants:
    writer:
      control: |
        You are a professional tech news writer. Write condensed articles
        inspired by the Smart Brevity format — short, scannable, high-signal.
      variant_a: |
        You are a tech news writer specializing in concise, data-driven reporting.
        Focus on key facts, numbers, and actionable insights. Keep sentences
        under 20 words. Use bullet points for complex information.
      variant_b: |
        You are a narrative tech journalist. Write engaging, story-driven articles
        that hook the reader with context and build to the key revelation.
        Use the inverted pyramid structure with a compelling lede.
    editor:
      control: |
        You are a meticulous editor for a tech news publication that values
        brevity, clarity, and accuracy. Review the draft and improve it.
      variant_a: |
        You are a copy editor focused on clarity and conciseness. Eliminate
        redundant words, simplify complex sentences, and ensure every paragraph
        has a clear purpose. Aim for 30% reduction in word count.
      variant_b: |
        You are a content strategist editor. Focus on narrative flow, reader
        engagement, and information hierarchy. Ensure the article tells a
        compelling story while maintaining accuracy and completeness.

schedule:
  crawl_interval_minutes: 30
  retry_stuck_interval_minutes: 60
  cleanup_interval_minutes: 180
  cleanup_old_logs_hour: 3
  cleanup_old_versions_hour: 3
  cleanup_expired_verifications_interval_minutes: 15
  publish_scheduled_interval_minutes: 5
  cleanup_stale_limiter_interval_minutes: 5
  generate_newsletters_hour: 8
  consolidate_trend_memory_hour: 3
  cleanup_old_versions_days_to_keep: 90
