providers:
  - id: ollama-local
    type: ollama
    enabled: true
    config:
      host: "http://localhost:11434"
      model: "qwen3:8b"
      max_tokens: 4096

  - id: openai
    type: openai
    enabled: false
    config:
      api_key: "${OPENAI_API_KEY}"
      base_url: "https://api.openai.com/v1"
      model: "gpt-4o-mini"
      max_tokens: 4096

  - id: anthropic
    type: anthropic
    enabled: false
    config:
      api_key: "${ANTHROPIC_API_KEY}"
      model: "claude-sonnet-4-5-20250929"
      max_tokens: 4096

  - id: gemini
    type: gemini
    enabled: false
    config:
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-2.0-flash"
      max_tokens: 4096

  - id: deepseek
    type: openai
    enabled: false
    config:
      api_key: "${DEEPSEEK_API_KEY}"
      base_url: "https://api.deepseek.com/v1"
      model: "deepseek-chat"
      max_tokens: 4096

  - id: groq
    type: openai
    enabled: false
    config:
      api_key: "${GROQ_API_KEY}"
      base_url: "https://api.groq.com/openai/v1"
      model: "llama-3.3-70b-versatile"
      max_tokens: 4096

  - id: openrouter
    type: openai
    enabled: false
    config:
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api/v1"
      model: "anthropic/claude-3.5-sonnet"
      max_tokens: 4096

  - id: xai
    type: openai
    enabled: false
    config:
      api_key: "${XAI_API_KEY}"
      base_url: "https://api.x.ai/v1"
      model: "grok-2-1212"
      max_tokens: 4096

  - id: togetherai
    type: openai
    enabled: false
    config:
      api_key: "${TOGETHERAI_API_KEY}"
      base_url: "https://api.togetherai.com/v1"
      model: "meta-llama/Llama-3-70b-chat-hf"
      max_tokens: 4096

  - id: fireworks
    type: openai
    enabled: false
    config:
      api_key: "${FIREWORKS_API_KEY}"
      base_url: "https://api.fireworks.ai/inference/v1"
      model: "accounts/fireworks/models/llama-v3-70b-instruct"
      max_tokens: 4096

  - id: cerebras
    type: openai
    enabled: false
    config:
      api_key: "${CEREBRAS_API_KEY}"
      base_url: "https://api.cerebras.ai/v1"
      model: "llama-3.3-70b"
      max_tokens: 4096

  - id: zai
    type: openai
    enabled: false
    config:
      api_key: "${ZAI_API_KEY}"
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      model: "glm-4"
      max_tokens: 4096

  - id: minimax
    type: openai
    enabled: false
    config:
      api_key: "${MINIMAX_API_KEY}"
      base_url: "https://api.minimax.io/v1"
      model: "MiniMax-M2.5"
      max_tokens: 4096

  - id: opencode
    type: openai
    enabled: false
    config:
      api_key: "${OPENCODE_API_KEY}"
      base_url: "https://api.opencode.ai/v1"
      model: "opencode"
      max_tokens: 4096

default_provider: ollama-local

search_providers:
  - id: duckduckgo
    type: duckduckgo
    enabled: true
    config: {}

  - id: google
    type: google
    enabled: false
    config:
      api_key: "${GOOGLE_API_KEY}"
      cse_id: "${GOOGLE_CSE_ID}"

  - id: searxng
    type: searxng
    enabled: false
    config:
      host: "http://localhost:8888"

  # Optional native Eggsearch binding is not installed by default. Enable only
  # after installing a qualified wheel and setting an explicit config_path.
  - id: eggsearch
    type: eggsearch
    enabled: false
    config:
      config_path: null

  - id: hybrid
    type: hybrid
    enabled: true
    config: {}  # FTS5 + vector similarity search

default_search_provider: duckduckgo
