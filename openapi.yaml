openapi: 3.0.3
info:
  title: ainews Admin API v1
  description: Admin API for managing ainews sources, articles, webhooks, and pipeline.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Admin API v1
paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: Service health status
  /sources:
    get:
      summary: List sources
      tags: [Sources]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated source list
    post:
      summary: Create source
      tags: [Sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Source created
  /sources/{id}:
    get:
      summary: Get source
      tags: [Sources]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Source details
    put:
      summary: Replace source
      tags: [Sources]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '200':
          description: Source replaced
    patch:
      summary: Update source
      tags: [Sources]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: Source updated
    delete:
      summary: Delete source
      tags: [Sources]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Source deleted
  /sources/{id}/refresh:
    post:
      summary: Refresh source
      tags: [Sources]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Source refresh triggered
        '404':
          description: Source not found
  /articles/{id}:
    get:
      summary: Get article
      tags: [Articles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Article details
        '404':
          description: Article not found
    put:
      summary: Update article
      tags: [Articles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticleRequest'
      responses:
        '200':
          description: Article updated
        '404':
          description: Article not found
    delete:
      summary: Delete article
      tags: [Articles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Article deleted
        '404':
          description: Article not found
  /articles/{id}/pipeline:
    post:
      summary: Trigger article pipeline
      tags: [Articles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: string
                  enum: [select, research, write, edit]
      responses:
        '200':
          description: Pipeline stage triggered
        '400':
          description: Invalid stage
        '404':
          description: Article not found
  /articles/{id}/quality:
    get:
      summary: Get article quality report
      tags: [Quality]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Quality report for article
        '404':
          description: No quality report found
  /articles/ids:
    get:
      summary: Get articles by IDs
      tags: [Articles]
      parameters:
        - in: query
          name: ids
          schema:
            type: string
          description: Comma-separated article IDs
      responses:
        '200':
          description: Articles list
  /articles/counts-by-status:
    get:
      summary: Get article counts by status
      tags: [Articles]
      responses:
        '200':
          description: Status counts
  /articles/bulk:
    post:
      summary: Bulk article operations
      tags: [Articles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [set_status, set_category, delete, reprocess, add_tags]
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Bulk operation result
  /sources/performance:
    get:
      summary: Source performance metrics
      tags: [Sources]
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 7
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Source performance metrics
  /topics/coverage:
    get:
      summary: Topic coverage analysis
      tags: [Sources]
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Topic coverage distribution
  /sources/recommendations:
    get:
      summary: Source recommendations
      tags: [Sources]
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Actionable source recommendations
  /sources/health:
    get:
      summary: Source health status
      tags: [Sources]
      responses:
        '200':
          description: Source health list
  /quality/recent:
    get:
      summary: Recent quality reports
      tags: [Quality]
      parameters:
        - in: query
          name: passed
          schema:
            type: string
          description: Filter by passed status (true/false)
        - in: query
          name: needs_review
          schema:
            type: string
          description: Filter by needs_review (true)
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Recent quality reports
  /alerts:
    get:
      summary: Active alerts
      tags: [Alerts]
      responses:
        '200':
          description: Active alerts grouped by severity
  /pipeline/stats:
    get:
      summary: Pipeline stage statistics
      tags: [Pipeline]
      responses:
        '200':
          description: Pipeline stats
  /pipeline/dead-letter/stats:
    get:
      summary: Dead letter queue stats
      tags: [Pipeline]
      responses:
        '200':
          description: Dead letter statistics
  /pipeline/backlog:
    get:
      summary: Pipeline backlog
      tags: [Pipeline]
      responses:
        '200':
          description: Backlog articles
  /pipeline/sla:
    get:
      summary: Pipeline SLA metrics
      tags: [Pipeline]
      responses:
        '200':
          description: SLA metrics (avg, p50, p95 processing times)
  /costs:
    get:
      summary: LLM cost summary
      tags: [Pipeline]
      responses:
        '200':
          description: Cost summary
  /newsletters/stats:
    get:
      summary: Newsletter delivery stats
      tags: [Newsletter]
      responses:
        '200':
          description: Aggregate delivery statistics
  /newsletter/preview:
    post:
      summary: Preview newsletter
      tags: [Newsletter]
      responses:
        '200':
          description: Newsletter preview
  /search/analytics:
    get:
      summary: Search analytics
      tags: [Search]
      responses:
        '200':
          description: Top queries and zero-result queries
  /audit-logs:
    get:
      summary: Audit logs
      tags: [Audit]
      parameters:
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: target_type
          schema:
            type: string
        - in: query
          name: days
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: Audit log entries
  /config/reload:
    post:
      summary: Reload configuration
      tags: [Config]
      responses:
        '200':
          description: Config reloaded
  /metrics:
    get:
      summary: Get metrics
      tags: [Metrics]
      responses:
        '200':
          description: Metrics data
  /metrics/prometheus:
    get:
      summary: Prometheus metrics
      tags: [Metrics]
      responses:
        '200':
          description: Prometheus formatted metrics
  /workers/health:
    get:
      summary: Celery worker health
      tags: [Health]
      responses:
        '200':
          description: Worker health status
  /task/{task_id}:
    get:
      summary: Get task status
      tags: [Tasks]
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task status
components:
  schemas:
    CreateSourceRequest:
      type: object
      required:
        - name
        - url
        - source_type
      properties:
        name:
          type: string
          maxLength: 128
        url:
          type: string
          format: uri
        source_type:
          type: string
          enum: [rss, api, scrape]
        topics:
          type: array
          items:
            type: string
    UpdateSourceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        url:
          type: string
          format: uri
        topics:
          type: array
          items:
            type: string
    UpdateArticleRequest:
      type: object
      properties:
        title:
          type: string
        impact_score:
          type: integer
        pipeline_status:
          type: string
    CreateWebhookRequest:
      type: object
      required:
        - name
        - url
        - events
      properties:
        name:
          type: string
          maxLength: 128
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [article.published, article.failed, newsletter.sent, newsletter.failed, article.selected]
        secret:
          type: string
    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: integer
        user:
          type: string
        ip_address:
          type: string
        details:
          type: object
        created_at:
          type: string
          format: date-time