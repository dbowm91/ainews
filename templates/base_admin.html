<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <title>{% block title %}ainews// admin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/share-a11y.js') }}" defer></script>
</head>
<body class="admin-body" hx-boost="true">
  <a href="#content" class="skip-link">Skip to content</a>
  <header class="admin-header">
    <nav class="nav">
      <a href="/admin/" class="logo">ainews<span class="logo-slash">//</span> admin</a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox" hidden>
      <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation">
        <span></span>
      </label>
      <div class="nav-links">
        <a href="/" hx-boost="false" {% if request.path == '/' %}class="active"{% endif %}>public site</a>
        <a href="/admin/" {% if request.path == '/admin/' %}class="active"{% endif %}>dashboard</a>
        <a href="/admin/pipelines" {% if request.path.startswith('/admin/pipelines') %}class="active"{% endif %}>pipelines</a>
        <a href="/admin/review" {% if request.path == '/admin/review' %}class="active"{% endif %}>review</a>
        <a href="/admin/articles" {% if request.path.startswith('/admin/articles') %}class="active"{% endif %}>articles</a>
        <a href="/admin/newsletters" {% if request.path.startswith('/admin/newsletters') %}class="active"{% endif %}>newsletters</a>
        <a href="/admin/metrics" {% if request.path == '/admin/metrics' %}class="active"{% endif %}>metrics</a>
        <a href="/admin/subscribers" {% if request.path.startswith('/admin/subscribers') %}class="active"{% endif %}>subscribers</a>
        <a href="/admin/shares" {% if request.path.startswith('/admin/shares') %}class="active"{% endif %}>shares</a>
      </div>
      <div class="nav-meta">
        <button type="button" class="theme-toggle" aria-label="Toggle theme">
          <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <form method="POST" action="/admin/logout" style="display:inline" hx-boost="false">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn-logout">logout</button>
        </form>
      </div>
    </nav>
  </header>

  <main class="container">
    {% block breadcrumbs %}{% endblock %}
    <div id="content">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
