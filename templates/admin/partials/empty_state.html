<div class="empty-state">
  <svg class="empty-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="12" y="12" width="40" height="40" rx="8" stroke="currentColor" stroke-width="2"/>
    <polyline points="24,32 30,38 42,26" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
  <span class="empty-title">{{ title or 'no items found' }}</span>
  {% if description %}<span class="empty-description">{{ description }}</span>{% endif %}
</div>
