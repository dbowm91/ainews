{% extends "base_admin.html" %}

{% block title %}ainews// admin — articles{% endblock %}

{% block breadcrumbs %}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <a href="/admin/">dashboard</a>
  <span class="breadcrumb-separator">›</span>
  <span class="breadcrumb-current">articles</span>
</nav>
{% endblock %}

{% block content %}
<div class="dashboard">
  <h1 class="dashboard-title">articles</h1>

  <section class="dash-card dash-card-full">
    <div class="search-container">
      <input type="text" class="search-input" name="q" aria-label="Search articles" placeholder="search articles..."
             value="{{ query }}"
             hx-get="/admin/articles"
             hx-trigger="input changed delay:300ms"
             hx-target="#articles-table"
             hx-include="[name='status'],[name='category'],[name='impact_min'],[name='impact_max'],[name='tag']"
             hx-indicator="#articles-table-spinner">
      <div class="filter-bar mt-05">
        <select name="status" class="filter-select" aria-label="Filter by status"
                hx-get="/admin/articles"
                hx-trigger="change"
                hx-target="#articles-table"
                hx-include="[name='q'],[name='category'],[name='impact_min'],[name='impact_max'],[name='tag']"
                hx-indicator="#articles-table-spinner"
                hx-push-url="true">
          <option value="">all statuses</option>
          {% for s in ['pending', 'researching', 'writing', 'editing', 'review', 'done', 'skipped'] %}
            <option value="{{ s }}" {% if status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
        <select name="category" class="filter-select" aria-label="Filter by category"
                hx-get="/admin/articles"
                hx-trigger="change"
                hx-target="#articles-table"
                hx-include="[name='q'],[name='status'],[name='impact_min'],[name='impact_max'],[name='tag']"
                hx-indicator="#articles-table-spinner"
                hx-push-url="true">
          <option value="">all categories</option>
          {% for c in categories %}
            <option value="{{ c }}" {% if category == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
        <select name="tag" class="filter-select" aria-label="Filter by tag"
                hx-get="/admin/articles"
                hx-trigger="change"
                hx-target="#articles-table"
                hx-include="[name='q'],[name='status'],[name='category'],[name='impact_min'],[name='impact_max']"
                hx-indicator="#articles-table-spinner"
                hx-push-url="true">
          <option value="">all tags</option>
          {% for t in all_tags %}
            <option value="{{ t.slug }}" {% if tag_slug == t.slug %}selected{% endif %}>{{ t.name }}</option>
          {% endfor %}
        </select>
        <div class="filter-group">
          <label class="filter-label">impact:</label>
          <input type="number" name="impact_min" class="filter-input" aria-label="Min impact score"
                 placeholder="min" value="{{ impact_min }}" min="0" max="100"
                 hx-get="/admin/articles"
                 hx-trigger="change"
                 hx-target="#articles-table"
                 hx-include="[name='q'],[name='status'],[name='category'],[name='tag'],[name='impact_max']"
                 hx-indicator="#articles-table-spinner"
                 hx-push-url="true">
          <input type="number" name="impact_max" class="filter-input" aria-label="Max impact score"
                 placeholder="max" value="{{ impact_max }}" min="0" max="100"
                 hx-get="/admin/articles"
                 hx-trigger="change"
                 hx-target="#articles-table"
                 hx-include="[name='q'],[name='status'],[name='category'],[name='tag'],[name='impact_min']"
                 hx-indicator="#articles-table-spinner"
                 hx-push-url="true">
        </div>
      </div>
    </div>

    <div id="articles-table" class="table-responsive admin-table-wrapper">
      <span id="articles-table-spinner" class="htmx-indicator">&nbsp;&nbsp;loading...</span>
      {% include "admin/partials/articles_table.html" %}
    </div>
  </section>
</div>
{% endblock %}
